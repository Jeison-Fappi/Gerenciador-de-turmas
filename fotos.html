<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotos - Gerenciador de Turmas</title>
    <link rel="icon" href="img/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <a class="side-brand" href="index.html">
          <img src="img/logo.png" width="38" height="38" alt="Residência" />
          <span>Gerenciador<br />de Turmas</span>
        </a>
        <nav class="side-nav">
          <a class="nav-i" href="index.html"><i class="bi bi-grid-1x2-fill"></i> Painel</a>
          <a class="nav-i" href="chamada.html"><i class="bi bi-clipboard2-check-fill"></i> Chamada</a>
          <a class="nav-i" href="graficos.html"><i class="bi bi-bar-chart-line-fill"></i> Gráficos</a>
          <a class="nav-i on" href="fotos.html"><i class="bi bi-images"></i> Fotos</a>
        </nav>
        <div class="side-user"><span id="userEmail"></span><button onclick="sair()"><i class="bi bi-box-arrow-right"></i> Sair</button></div>
      </aside>

      <main class="main">
        <header class="head">
          <div>
            <h1>Fotos por turma</h1>
            <p style="text-transform:none">Armazene e consulte as imagens da turma selecionada.</p>
          </div>
          <a class="btn-ghost" href="index.html"><i class="bi bi-arrow-left"></i> Voltar ao painel</a>
        </header>

        <section class="card-x pad fotos-controles">
          <div class="fotos-form">
            <div class="fotos-campo">
              <label class="form-label" for="turmaFotos">Turma</label>
              <select id="turmaFotos" class="form-select"></select>
            </div>
            <div class="fotos-campo">
              <label class="form-label" for="arquivosFotos">Selecionar fotos</label>
              <input id="arquivosFotos" class="form-control" type="file" accept="image/jpeg,image/png,image/webp" multiple disabled />
              <div class="form-text">JPG, PNG ou WebP, até 10 MB por imagem.</div>
            </div>
            <div class="fotos-campo fotos-campo-acao">
              <span class="form-label">Ações</span>
              <button id="enviarFotos" class="btn-blue w-100" type="button" disabled>Enviar fotos</button>
            </div>
          </div>
          <div id="statusFotos" class="fotos-status" role="status" aria-live="polite"></div>
        </section>

        <section class="mt">
          <div class="fotos-cabecalho">
            <h2 class="card-title">Galeria</h2>
            <div class="fotos-galeria-acoes">
              <span id="totalFotos" class="text-muted"></span>
              <button id="baixarTodasFotos" class="btn-ghost" type="button" disabled>
                <i class="bi bi-file-earmark-zip"></i> Baixar todas
              </button>
            </div>
          </div>
          <div id="galeriaFotos" class="fotos-grid"></div>
        </section>
      </main>

      <div id="visualizadorFotos" class="foto-lightbox" role="dialog" aria-modal="true" aria-labelledby="fotoAmpliadaNome" hidden>
        <button id="fecharVisualizadorFotos" class="foto-lightbox-fechar" type="button" aria-label="Fechar visualização">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
        <button id="fotoAnterior" class="foto-lightbox-controle foto-lightbox-anterior" type="button" aria-label="Foto anterior">
          <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>
        <figure class="foto-lightbox-figura">
          <img id="fotoAmpliada" src="" alt="" />
          <figcaption>
            <span id="fotoAmpliadaNome"></span>
            <span id="fotoAmpliadaContador"></span>
          </figcaption>
        </figure>
        <button id="proximaFoto" class="foto-lightbox-controle foto-lightbox-proxima" type="button" aria-label="Próxima foto">
          <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/fotos-page.js"></script>
  </body>
</html>

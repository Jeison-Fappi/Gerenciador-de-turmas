<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar - Gerenciador de Turmas</title>
    <link rel="icon" href="img/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <img src="img/logo.png" width="52" height="52" alt="Residência" />
      <h1>Gerenciador de Turmas</h1>
      <p>Entre com o e-mail e a senha criados pela coordenação.</p>

      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input id="email" type="email" class="form-control" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="senha">Senha</label>
          <input id="senha" type="password" class="form-control" required autocomplete="current-password" />
        </div>
        <div id="erroLogin" class="login-erro d-none"></div>
        <button id="btnEntrar" type="submit" class="btn-blue w-100 justify-content-center">Entrar</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>

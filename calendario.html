<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calendário de Observações</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/calendario.css" />
  </head>

  <body>
    <div class="container py-5">
      <!-- ========================================= -->
      <!-- VOLTAR -->
      <!-- ========================================= -->

      <div class="mb-4">
        <a href="index.html" class="btn btn-outline-dark">
          <i class="bi bi-arrow-left"></i>
          Voltar para a lista
        </a>
      </div>

      <!-- ========================================= -->
      <!-- CABEÇALHO DO ALUNO -->
      <!-- ========================================= -->

      <div class="card shadow border-0 mb-4">
        <div class="card-body text-center">
          <i class="bi bi-person-circle fs-1 text-primary"></i>

          <h3 id="nomeAlunoCalendario" class="mt-2 mb-0">Carregando...</h3>

          <p class="text-muted mb-0" id="turmaAlunoCalendario"></p>
        </div>
      </div>

      <!-- ========================================= -->
      <!-- CALENDÁRIO -->
      <!-- ========================================= -->

      <div class="card shadow border-0">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <button
              class="btn btn-primary btn-sm"
              onclick="mudarMes(-1)"
              title="Mês anterior"
            >
              <i class="bi bi-chevron-left"></i>
            </button>

            <h4 id="mesAnoAtual" class="mb-0 text-capitalize"></h4>

            <button
              class="btn btn-primary btn-sm"
              onclick="mudarMes(1)"
              title="Próximo mês"
            >
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>

          <div class="calendario-semana">
            <div>Dom</div>
            <div>Seg</div>
            <div>Ter</div>
            <div>Qua</div>
            <div>Qui</div>
            <div>Sex</div>
            <div>Sáb</div>
          </div>

          <div id="calendarioGrid" class="calendario-grid">
            <!-- Preenchido via JavaScript -->
          </div>

          <div class="calendario-legenda mt-4">
            <span class="legenda-item">
              <span class="legenda-bolinha legenda-vermelha"></span>
              Dia com observação
            </span>

            <span class="legenda-item">
              <span class="legenda-bolinha legenda-hoje"></span>
              Hoje
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================= -->
    <!-- SCRIPTS -->
    <!-- ========================================= -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JavaScript -->
    <script src="js/calendario.js"></script>
  </body>
</html>

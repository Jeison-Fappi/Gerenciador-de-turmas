<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gráficos - Gerenciador de Turmas</title>
    <link rel="icon" href="img/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <a class="side-brand" href="index.html">
          <img src="img/logo.png" width="38" height="38" alt="Residência" />
          <span>Gerenciador<br />de Turmas</span>
        </a>
        <nav class="side-nav">
          <a class="nav-i" href="index.html"><i class="bi bi-grid-1x2-fill"></i> Painel</a>
          <a class="nav-i" href="chamada.html"><i class="bi bi-clipboard2-check-fill"></i> Chamada</a>
          <a class="nav-i on" href="graficos.html"><i class="bi bi-bar-chart-line-fill"></i> Gráficos</a>
        </nav>
      <div class="side-user"><span id="userEmail"></span><button onclick="sair()"><i class="bi bi-box-arrow-right"></i> Sair</button></div>
      </aside>

      <main class="main">
        <header class="head">
          <div>
            <h1>Gráficos de faltas</h1>
            <p style="text-transform:none">Compare as turmas e veja as faltas de cada aluno.</p>
          </div>
          <a class="btn-ghost" href="index.html"><i class="bi bi-arrow-left"></i> Voltar ao painel</a>
        </header>

        <div id="aviso" class="card-x vazio d-none"></div>

        <div id="conteudo">
          <div class="chips" id="chips"></div>

          <section class="strip s4">
            <div><small><i class="bi bi-people-fill"></i> Alunos</small><strong id="kAlunos">0</strong></div>
            <div><small><i class="bi bi-calendar-x-fill"></i> Faltas</small><strong id="kFaltas">0</strong></div>
            <div><small><i class="bi bi-bar-chart-fill"></i> Média de faltas</small><strong id="kMedia">0</strong></div>
            <div class="risk"><small><span class="dot dot-risk"></span> Em risco</small><strong id="kRisco">0</strong></div>
          </section>

          <section class="row g-3 mt">
            <div class="col-lg-7"><div class="card-x pad"><h2 class="card-title">Faltas por turma</h2><div class="chart-box"><canvas id="graficoTurmas"></canvas></div></div></div>
            <div class="col-lg-5"><div class="card-x pad"><h2 class="card-title">Situação dos alunos</h2><div class="chart-box"><canvas id="graficoSituacao"></canvas></div></div></div>
            <div class="col-12"><div class="card-x pad"><h2 class="card-title">Faltas por aluno</h2><div class="chart-box" id="boxAlunos"><canvas id="graficoAlunos"></canvas></div></div></div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="js/turmas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/graficos-page.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Controle de Presença</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container py-5">
      <!-- ========================================= -->
      <!-- CABEÇALHO -->
      <!-- ========================================= -->

      <header class="text-center mb-5">
        <h1 id="titulo">
          <i class="bi bi-mortarboard-fill"></i>

          Controle de Presença
        </h1>

        <p class="text-muted">Sistema para gerenciamento de turmas.</p>
      </header>

      <!-- ========================================= -->
      <!-- DASHBOARD -->
      <!-- ========================================= -->

      <div class="row g-4">
        <div class="col-lg-2 col-md-4">
          <div class="card shadow border-0">
            <div class="card-body text-center">
              <i class="bi bi-people-fill fs-1 text-primary"></i>

              <h6 class="mt-3">Alunos</h6>

              <h2 id="totalAlunos">0</h2>
            </div>
          </div>
        </div>

        <div class="col-lg-2 col-md-4">
          <div class="card shadow border-0">
            <div class="card-body text-center">
              <i class="bi bi-calendar-x-fill fs-1 text-danger"></i>

              <h6 class="mt-3">Faltas</h6>

              <h2 id="totalFaltas">0</h2>
            </div>
          </div>
        </div>

        <div class="col-lg-2 col-md-4">
          <div class="card shadow border-0">
            <div class="card-body text-center">
              <i class="bi bi-exclamation-circle-fill fs-1 text-warning"></i>

              <h6 class="mt-3">Em Atenção</h6>

              <h2 id="emAtencao">0</h2>
            </div>
          </div>
        </div>

        <div class="col-lg-2 col-md-4">
          <div class="card shadow border-0">
            <div class="card-body text-center">
              <i class="bi bi-x-octagon-fill fs-1 text-danger"></i>

              <h6 class="mt-3">Em Risco</h6>

              <h2 id="emRisco">0</h2>
            </div>
          </div>
        </div>

        <div class="col-lg-2 col-md-4">
          <div class="card shadow border-0">
            <div class="card-body text-center">
              <i class="bi bi-bar-chart-fill fs-1 text-success"></i>

              <h6 class="mt-3">Média</h6>

              <h2 id="mediaFaltas">0</h2>
            </div>
          </div>
        </div>

        <div class="col-lg-2 col-md-6">
          <div class="card shadow border-0">
            <div class="card-body text-center">
              <i class="bi bi-trophy-fill fs-1 text-warning"></i>

              <h6 class="mt-3">Destaque</h6>

              <h6 id="melhorAluno">0</h6>
            </div>
          </div>
        </div>
      </div>

      <!-- ========================================= -->
      <!-- CADASTRO -->
      <!-- ========================================= -->

      <div class="card shadow mt-5">
        <div class="card-body">
          <h4 class="mb-4">
            <i class="bi bi-person-plus-fill"></i>

            Cadastro de Aluno
          </h4>

          <div class="row">
            <!-- Nome -->

            <div class="col-md-5">
              <label class="form-label"> Nome </label>

              <input
                id="nomeAluno"
                type="text"
                class="form-control"
                placeholder="Digite o nome"
              />
            </div>

            <!-- Turma -->

            <div class="col-md-5">
              <label class="form-label"> Turma </label>

              <select id="turmaAluno" class="form-select">
                <option value="">Selecione a turma</option>
              </select>
            </div>

            <!-- Botão -->

            <div class="col-md-2 d-flex align-items-end">
              <button class="btn btn-primary w-100" onclick="cadastrarAluno()">
                <i class="bi bi-person-plus-fill"></i>

                Cadastrar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ========================================= -->
      <!-- PESQUISA -->
      <!-- ========================================= -->

      <div class="row mt-5 g-3">
        <!-- Pesquisa -->

        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>

            <input
              id="pesquisa"
              type="text"
              class="form-control"
              placeholder="Pesquisar aluno..."
            />
          </div>
        </div>

        <!-- Filtro turma -->

        <div class="col-md-6">
          <select id="filtroTurma" class="form-select">
            <option value="TODAS">Todas as turmas</option>
          </select>
        </div>
      </div>

      <!-- ========================================= -->
      <!-- TABELA -->
      <!-- ========================================= -->

      <table class="table table-striped table-hover mt-4">
        <thead class="table-dark">
          <tr>
            <th>Aluno</th>

            <th>Turma</th>

            <th>Faltas</th>

            <th>Situação</th>

            <th width="240">Ações</th>
          </tr>
        </thead>

        <tbody id="tabelaAlunos"></tbody>
      </table>
    </div>

    <!-- ========================================= -->
    <!-- MODAL EDITAR -->
    <!-- ========================================= -->

    <div class="modal fade" id="modalEditar" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="bi bi-pencil-square"></i>

              Editar Aluno
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label"> Nome </label>

              <input id="editarNome" type="text" class="form-control" />
            </div>

            <div>
              <label class="form-label"> Turma </label>

              <select id="editarTurma" class="form-select">
                <option value="">Selecione a turma</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>

            <button
              type="button"
              class="btn btn-primary"
              onclick="salvarEdicao()"
            >
              <i class="bi bi-check-circle"></i>

              Salvar Alterações
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/turmas.js"></script>

    <script src="js/script.js"></script>
  </body>
</html>

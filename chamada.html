<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamada - Gerenciador de Turmas</title>
    <link rel="icon" href="img/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <a class="side-brand" href="index.html">
          <img src="img/logo.png" width="38" height="38" alt="Residência" />
          <span>Gerenciador<br />de Turmas</span>
        </a>
        <nav class="side-nav">
          <a class="nav-i" href="index.html"><i class="bi bi-grid-1x2-fill"></i> Painel</a>
          <a class="nav-i on" href="chamada.html"><i class="bi bi-clipboard2-check-fill"></i> Chamada</a>
          <a class="nav-i" href="graficos.html"><i class="bi bi-bar-chart-line-fill"></i> Gráficos</a>
        </nav>
      <div class="side-user"><span id="userEmail"></span><button onclick="sair()"><i class="bi bi-box-arrow-right"></i> Sair</button></div>
      </aside>

      <main class="main">
        <header class="head">
          <div>
            <h1>Chamada</h1>
            <p style="text-transform:none">Marque quem faltou. As alterações são salvas na hora.</p>
          </div>
        </header>

        <div class="ctrl">
          <div class="campo">
            <label class="form-label">Turma</label>
            <select id="turmaChamada" class="form-select"></select>
          </div>
          <div>
            <label class="form-label">Dia</label>
            <div class="dia-nav">
              <button class="ibtn" onclick="mover(-1)" title="Dia anterior"><i class="bi bi-chevron-left"></i></button>
              <input id="dataChamada" type="date" class="form-control" />
              <button class="ibtn" onclick="mover(1)" title="Próximo dia"><i class="bi bi-chevron-right"></i></button>
              <button class="btn-ghost" onclick="irHoje()">Hoje</button>
            </div>
          </div>
        </div>

        <p class="dia-label"><span id="diaLabel"></span> <span id="avisoFds" class="chip d-none">fim de semana</span></p>

        <section class="strip s4">
          <div><small><span class="dot" style="background:#2fa77a"></span> Presentes</small><strong id="cP">0</strong></div>
          <div class="risk"><small><span class="dot dot-risk"></span> Faltas</small><strong id="cF">0</strong></div>
          <div class="warn"><small><span class="dot dot-warn"></span> Justificadas</small><strong id="cJ">0</strong></div>
          <div><small><i class="bi bi-question-circle"></i> Sem marcação</small><strong id="cS">0</strong></div>
        </section>

        <section class="card-x mt">
          <div id="listaChamada"></div>
          <div class="rodape-ch">
            <span class="text-muted" style="font-size:13.5px">Toque novamente no botão marcado para desfazer.</span>
            <button class="btn-blue" id="btnRestante" onclick="marcarRestante()"><i class="bi bi-check2-all"></i> Marcar o restante como presente</button>
          </div>
        </section>
      </main>
    </div>

    <script src="js/turmas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/chamada.js"></script>
  </body>
</html>
